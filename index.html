<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#05060f" />
<title>BrainScan AI — Intelligent Brain Image Classification</title>
<meta name="description" content="BrainScan AI is an educational AI project that classifies brain images into four trained categories using a machine-learning image classification model." />

<!-- External Libraries: TensorFlow.js + Teachable Machine Image library -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

<style>
:root{
  --bg:#05060f;
  --bg-2:#0a0d1c;
  --panel:rgba(18,22,43,0.55);
  --panel-border:rgba(120,160,255,0.18);
  --text:#e8ecff;
  --muted:#9aa3c7;
  --primary:#6ea8ff;
  --primary-2:#8b5cff;
  --accent:#22d3ee;
  --glow:rgba(110,168,255,0.55);
  --danger:#ff6b8b;
  --radius:18px;
  --maxw:1200px;
  --font:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  font-family:var(--font);
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 80% -10%, rgba(139,92,255,0.18), transparent 60%),
    radial-gradient(1000px 700px at 0% 10%, rgba(34,211,238,0.12), transparent 55%),
    linear-gradient(180deg, var(--bg), var(--bg-2));
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.6;
}

#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#cursor-glow{
  position:fixed;top:0;left:0;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle, rgba(110,168,255,0.16), transparent 65%);
  transform:translate(-50%,-50%);pointer-events:none;z-index:1;
  transition:opacity .4s ease;filter:blur(4px);
}
.content{position:relative;z-index:2}

a{color:inherit;text-decoration:none}
.container{max-width:var(--maxw);margin:0 auto;padding:0 24px}
section{padding:96px 0;scroll-margin-top:84px}
.eyebrow{
  display:inline-block;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);margin-bottom:14px;font-weight:600;
}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em}
h2.section-title{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:14px;text-wrap:balance}
.section-sub{color:var(--muted);max-width:640px;font-size:1.02rem;text-wrap:pretty}

.glass{
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:var(--radius);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 20px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
}

.btn{
  display:inline-flex;align-items:center;gap:10px;cursor:pointer;
  font-weight:600;font-size:.98rem;border:none;border-radius:14px;
  padding:14px 26px;color:#fff;transition:transform .2s ease, box-shadow .3s ease, filter .2s ease;
  font-family:inherit;
}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  box-shadow:0 10px 30px rgba(110,168,255,0.35);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(110,168,255,0.5)}
.btn-ghost{
  background:rgba(255,255,255,0.04);border:1px solid var(--panel-border);color:var(--text);
}
.btn-ghost:hover{transform:translateY(-2px);border-color:var(--primary)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

header.nav{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:rgba(5,6,15,0.6);
  border-bottom:1px solid rgba(120,160,255,0.12);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.15rem}
.logo-mark{
